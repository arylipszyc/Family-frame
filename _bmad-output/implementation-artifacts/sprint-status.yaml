risks_and_gaps:
  - id: GAP-1
    severity: closed
    title: Album ID de Google Photos sin UI de configuración
    detail: photoSyncService lee 'googlePhotosAlbumId' de Preferences pero AdminScreen no tiene UI para setearlo.
    resolution: Cerrado 2026-04-26 por Story 4.5 — bootstrap vía album-config.json en Directory.External al boot.

  - id: GAP-2
    severity: medium
    title: Backfill de stories Epics 3 y 4
    detail: 6 stories sin archivo formal. El código existe y los tests pasan, pero no hay auditoría documentada contra ACs originales del epic.
    impact: Si algún AC quedó sin cubrir, no lo sabemos hasta correr en tablet.

  - id: GAP-3
    severity: closed
    title: Validación end-to-end con Drive + SA + sync real
    detail: |
      APK sideload + arranque automático validados 2026-04-27. Photos API + OAuth tried 2026-05-16 y rota
      (insufficient scopes). Reescritura a Drive + SA completada 2026-05-16 (story 4.6).
    resolution: |
      Cerrado 2026-05-16 — flow end-to-end validado en hardware: sa-config.json + drive-folder-config.json
      copiados por MTP, bootstrap los procesó y borró al boot, AdminScreen muestra "SA configurado ✓",
      forzar sync trae fotos de family-frame-fotos. Descubrió y se fixearon 3 bugs preexistentes:
      (a) photoCacheService.savePhoto faltaba `recursive: true` (Story 4.1 done_undocumented),
      (b) KioskScreen no pasaba intervalMs prop a PhotoSlide — rotación quedaba en default 30s (Story 2.1),
      (c) PhotoSlide objectFit cover→contain para fotos verticales (cabezas cortadas).

  - id: GAP-4
    severity: medium
    title: Foto y mensaje real del primer encendido sin coordinar
    detail: WelcomeScreen real existe, pero el contenido emocional (foto hermanos + mensaje de regalo aniversario) requiere coordinación con los hermanos y carga vía AdminScreen. No es código — es contenido.

  - id: GAP-5
    severity: low
    title: Wake-on-boot requiere toque inicial
    detail: Al primer boot, la pantalla queda apagada hasta que se toque la pantalla — aún con WAKE_LOCK adquirido en MainActivity.onCreate. Owner aceptó como no-bloqueante 2026-04-27.
    resolution_notes: Si en el futuro se quiere fixear, parche estimado en MainActivity.java — `setTurnScreenOn(true)` + `setShowWhenLocked(true)` + `FLAG_KEEP_SCREEN_ON`. Va a Amelia con coord file.

  - id: GAP-6
    severity: closed
    title: APK crash loop por OOM en Capacitor bridge con foto > 20MB
    detail: |
      Stress test 2026-05-17/18 reveló crash loop. 3 FATAL EXCEPTION idénticos en logcat
      (PIDs 7845, 9245, 9632) — todos OutOfMemoryError tratando de alocar 177577024 bytes
      en MessageHandler.postMessage → JSONTokener al guardar una foto. Causa raíz:
      photoCacheService.savePhoto convierte blob → base64 y lo manda como JSON al bridge;
      la JVM tiene heap 256MB y el base64 de ~127MB binarios excede el límite.
      Owner identificó 2 archivos > 20MB en el folder Drive y los borró manualmente.
    resolution: |
      Cerrado 2026-05-18 — fix(drive-sync) commit f674f06: filtro > 20MB en query Drive
      con console.warn. Validado en hardware: APK firmado, instalado, app estable.
      Proper fix (Filesystem.downloadFile streaming sin bridge) deferred — ver deferred-work.md.

